<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#202A22">
<title>Binder — Catatan Kuliah</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23202A22'/%3E%3Crect x='28' y='20' width='44' height='60' rx='5' fill='%23F3EFE6'/%3E%3Crect x='28' y='20' width='9' height='60' rx='3' fill='%238B5E3C'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Binder">
<style>
/* ===== Tokens ===== */
:root {
  color-scheme: light;
  --paper: #F3EFE6;
  --paper-raised: #FFFDF8;
  --ink: #202A22;
  --ink-soft: #55604F;
  --leather: #8B5E3C;
  --leather-dark: #6E4A2E;
  --gold: #7f2424;
  --line: #DCD5C4;
  --danger: #A6402C;
  --radius-lg: 18px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --font-head: Georgia, "Iowan Old Style", "Palatino Linotype", ui-serif, serif;
  --font-body: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #1B1B17;
    --paper-raised: #24241E;
    --ink: #EDE7D8;
    --ink-soft: #A9A28E;
    --leather: #B5824F;
    --leather-dark: #8B5E3C;
    --gold: #42c3ff;
    --line: #3A382E;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #1B1B17;
  --paper-raised: #24241E;
  --ink: #EDE7D8;
  --ink-soft: #A9A28E;
  --leather: #B5824F;
  --leather-dark: #8B5E3C;
  --gold: #761e1e;
  --line: #3A382E;
}

* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
}
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}
html { scroll-padding-top: var(--safe-top); }
button, input, textarea { font-family: inherit; color: inherit; }
.hidden { display: none !important; }

/* ===== App layout: 3 panels ===== */
.app {
  height: calc(100% - var(--safe-top) - var(--safe-bottom) - 34px);
  display: grid;
  grid-template-columns: 240px 280px 1fr;
}
.panel {
  min-width: 0;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--line);
  overflow: hidden;
}
.panel-editor { border-right: none; }

.panel-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 14px 10px;
  flex-shrink: 0;
}
.brand {
  font-family: var(--font-head);
  font-size: 1.3rem;
  font-weight: 700;
  margin: 0;
  flex: 1;
  letter-spacing: 0.2px;
}
.panel-title {
  font-family: var(--font-head);
  font-size: 1.05rem;
  margin: 0;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.btn-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--paper-raised);
  color: var(--ink);
  font-size: 1.1rem;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.btn-icon:active { transform: scale(0.94); }
.btn-back { display: none; font-size: 1.4rem; }
.btn-danger { border-color: transparent; color: var(--ink-soft); }
.btn-danger:hover { color: var(--danger); }

/* ===== Binder list (tab-like spines) ===== */
.binder-list {
  list-style: none;
  margin: 0;
  padding: 4px 10px 10px;
  overflow-y: auto;
  flex: 1;
}
.binder-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 10px 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  margin-bottom: 4px;
  position: relative;
}
.binder-item:hover { background: var(--paper-raised); }
.binder-item.active { background: var(--paper-raised); box-shadow: inset 3px 0 0 var(--spine, var(--leather)); }
.binder-spine {
  width: 10px;
  height: 28px;
  border-radius: 3px;
  background: var(--spine, var(--leather));
  flex-shrink: 0;
}
.binder-name {
  flex: 1;
  font-size: 0.95rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.binder-count {
  font-size: 0.75rem;
  color: var(--ink-soft);
}
.binder-edit {
  opacity: 0;
  background: none;
  border: none;
  color: var(--ink-soft);
  cursor: pointer;
  padding: 4px;
}
.binder-item:hover .binder-edit { opacity: 1; }

.empty-hint {
  padding: 8px 16px 16px;
  color: var(--ink-soft);
  font-size: 0.85rem;
  line-height: 1.5;
}

/* ===== Notes list ===== */
.search-box {
  margin: 0 14px 8px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--paper-raised);
  font-size: 0.88rem;
}
.search-box:focus { outline: 2px solid var(--gold); outline-offset: 1px; }

.note-list {
  list-style: none;
  margin: 0;
  padding: 0 10px 10px;
  overflow-y: auto;
  flex: 1;
}
.note-item {
  padding: 10px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  margin-bottom: 3px;
  border-bottom: 1px dashed var(--line);
}
.note-item:hover { background: var(--paper-raised); }
.note-item.active { background: var(--paper-raised); box-shadow: inset 3px 0 0 var(--gold); }
.note-item-title {
  font-size: 0.92rem;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.note-item-snippet {
  font-size: 0.78rem;
  color: var(--ink-soft);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-top: 2px;
}
.note-item-date {
  font-size: 0.7rem;
  color: var(--ink-soft);
  margin-top: 3px;
}

/* ===== Editor ===== */
.panel-editor { background: var(--paper-raised); position: relative; }
.editor-head { padding-bottom: 6px; }
.note-title-input {
  flex: 1;
  border: none;
  background: transparent;
  font-family: var(--font-head);
  font-size: 1.35rem;
  font-weight: 700;
  padding: 4px 2px;
}
.note-title-input:focus { outline: none; }

.editor-meta {
  display: flex;
  justify-content: space-between;
  padding: 0 16px 10px;
  font-size: 0.75rem;
  color: var(--ink-soft);
  flex-shrink: 0;
}
.save-state { font-variant: small-caps; }

.note-body {
  flex: 1;
  border: none;
  resize: none;
  background: transparent;
  padding: 6px 20px 24px;
  font-size: 1rem;
  line-height: 1.65;
  font-family: var(--font-body);
}
.note-body:focus { outline: none; }

.empty-state {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-soft);
  text-align: center;
  padding: 20px;
  pointer-events: none;
}

/* ===== Dialog ===== */
.dialog-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(20, 18, 12, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 20px;
}
.dialog {
  background: var(--paper-raised);
  border-radius: var(--radius-lg);
  padding: 22px;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}
.dialog h3 { margin: 0 0 14px; font-family: var(--font-head); }
.field-label { display: block; font-size: 0.78rem; color: var(--ink-soft); margin: 12px 0 6px; }
#binderNameInput {
  width: 100%;
  padding: 9px 11px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--paper);
  font-size: 0.95rem;
}
.color-picker { display: flex; gap: 8px; flex-wrap: wrap; }
.color-swatch {
  width: 28px; height: 28px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
}
.color-swatch.selected { border-color: var(--ink); }

.dialog-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 20px;
  gap: 10px;
}
.dialog-actions-right { display: flex; gap: 8px; }
.btn {
  padding: 8px 16px;
  border-radius: 999px;
  border: 1px solid transparent;
  cursor: pointer;
  font-size: 0.88rem;
}
.btn-ghost { background: transparent; border-color: var(--line); }
.btn-primary { background: var(--ink); color: var(--paper); }
.btn-danger-text { background: transparent; color: var(--danger); border: none; padding-left: 0; }

/* ===== Footer ===== */
.app-footer {
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 0.75rem;
  color: var(--ink-soft);
  border-top: 1px solid var(--line);
}
.link-btn {
  background: none;
  border: none;
  color: var(--ink-soft);
  text-decoration: underline;
  cursor: pointer;
  font-size: 0.75rem;
  padding: 4px;
}
.dot { opacity: 0.5; }

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: calc(44px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--paper);
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 0.85rem;
  z-index: 100;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}

/* ===== Responsive: single-column drill-down on phones ===== */
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .panel { border-right: none; display: none; }
  .btn-back { display: flex; }
  .app.view-binders .panel-binders { display: flex; }
  .app.view-notes .panel-notes { display: flex; }
  .app.view-editor .panel-editor { display: flex; }
}
@media (min-width: 861px) {
  .btn-back { display: none; }
}

/* ===== TAMBAHAN: tag, toolbar format, pratinjau (hanya memakai warna token di atas) ===== */
.tag-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.72rem;
  padding: 2px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink-soft);
  cursor: default;
  line-height: 1.5;
}
.tag-chip button {
  background: none;
  border: none;
  padding: 0 0 0 2px;
  cursor: pointer;
  color: var(--ink-soft);
  font-size: 0.85rem;
  line-height: 1;
}
.tag-chip button:hover { color: var(--danger); }
.tag-chip.filter { cursor: pointer; background: var(--paper-raised); }
.tag-chip.filter.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tag-filter { padding: 0 14px 8px; flex-shrink: 0; }
.note-item .tag-chips { margin-top: 5px; }
.note-item .tag-chip { font-size: 0.66rem; padding: 0 7px; }

.tag-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: 0 16px 8px;
  flex-shrink: 0;
}
.tag-input {
  border: 1px dashed var(--line);
  background: transparent;
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 0.75rem;
  width: 110px;
}
.tag-input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }

.editor-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 6px 14px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.tool-btn {
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: var(--radius-sm);
  padding: 4px 9px;
  font-size: 0.8rem;
  cursor: pointer;
  min-width: 32px;
}
.tool-btn:active { transform: scale(0.95); }
.tool-btn:disabled { opacity: 0.4; cursor: default; }
.tool-btn.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tool-spacer { flex: 1; }

.note-preview {
  flex: 1;
  overflow-y: auto;
  padding: 10px 20px 24px;
  line-height: 1.65;
  font-size: 1rem;
}
.note-preview h1, .note-preview h2, .note-preview h3 { font-family: var(--font-head); margin: 1em 0 0.4em; line-height: 1.25; }
.note-preview h1 { font-size: 1.5rem; }
.note-preview h2 { font-size: 1.25rem; }
.note-preview h3 { font-size: 1.08rem; }
.note-preview p { margin: 0 0 0.8em; }
.note-preview ul, .note-preview ol { margin: 0 0 0.8em; padding-left: 1.4em; }
.note-preview li.check { list-style: none; margin-left: -1.2em; }
.note-preview blockquote { margin: 0 0 0.8em; padding: 2px 0 2px 12px; border-left: 3px solid var(--leather); color: var(--ink-soft); }
.note-preview code { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 0.92em; }
.note-preview hr { border: none; border-top: 1px solid var(--line); margin: 1em 0; }
.note-preview .muted { color: var(--ink-soft); }
</style>
</head>
<body>

<div id="app" class="app">

  <!-- ===== Panel 1: Daftar Binder (mata kuliah) ===== -->
  <aside id="panelBinders" class="panel panel-binders">
    <div class="panel-head">
      <h1 class="brand">CATATAN KAMU</h1>
      <button id="btnTheme" class="btn-icon" title="Ganti tema terang/gelap" aria-label="Ganti tema">☾</button>
      <button id="btnAddBinder" class="btn-icon" title="Tambah binder baru" aria-label="Tambah binder">+</button>
    </div>
    <ul id="binderList" class="binder-list"></ul>
    <p id="binderEmpty" class="empty-hint">Belum ada catatan. Tambahkan misalnya "catatan untuk orang tersayang".</p>
  </aside>

  <!-- ===== Panel 2: Daftar catatan dalam binder ===== -->
  <section id="panelNotes" class="panel panel-notes">
    <div class="panel-head">
      <button id="btnBackToBinders" class="btn-icon btn-back" aria-label="Kembali ke daftar binder">‹</button>
      <h2 id="notesTitle" class="panel-title">Pilih binder</h2>
      <button id="btnAddNote" class="btn-icon" title="Tambah catatan baru" aria-label="Tambah catatan">+</button>
    </div>
    <input id="searchNotes" class="search-box" type="search" placeholder="Cari catatan di binder ini…" />
    <div id="tagFilter" class="tag-filter tag-chips hidden"></div>
    <ul id="noteList" class="note-list"></ul>
    <p id="noteEmpty" class="empty-hint">Belum ada catatan di binder ini.</p>
  </section>

  <!-- ===== Panel 3: Editor catatan ===== -->
  <main id="panelEditor" class="panel panel-editor">
    <div class="panel-head editor-head">
      <button id="btnBackToNotes" class="btn-icon btn-back" aria-label="Kembali ke daftar catatan">‹</button>
      <input id="noteTitleInput" class="note-title-input" type="text" placeholder="Judul catatan" />
      <button id="btnDeleteNote" class="btn-icon btn-danger" title="Hapus catatan" aria-label="Hapus catatan">🗑</button>
    </div>
    <div class="editor-meta">
      <span id="noteMeta"></span>
      <span id="saveState" class="save-state">Tersimpan</span>
    </div>
    <div id="tagBar" class="tag-bar">
      <div id="tagChips" class="tag-chips"></div>
      <input id="tagInput" class="tag-input" type="text" maxlength="30" placeholder="+ tag" aria-label="Tambah tag" />
    </div>
    <div id="editorToolbar" class="editor-toolbar">
      <button type="button" class="tool-btn" data-act="bold" title="Tebal (Ctrl+B)"><b>B</b></button>
      <button type="button" class="tool-btn" data-act="italic" title="Miring (Ctrl+I)"><i>I</i></button>
      <button type="button" class="tool-btn" data-act="h1" title="Judul besar">H1</button>
      <button type="button" class="tool-btn" data-act="h2" title="Judul sedang">H2</button>
      <button type="button" class="tool-btn" data-act="ul" title="Daftar poin">• Poin</button>
      <button type="button" class="tool-btn" data-act="ol" title="Daftar angka">1. Angka</button>
      <button type="button" class="tool-btn" data-act="check" title="Daftar centang">☐ Centang</button>
      <button type="button" class="tool-btn" data-act="quote" title="Kutipan">❝</button>
      <span class="tool-spacer"></span>
      <button type="button" id="btnPreview" class="tool-btn" title="Lihat hasil format">👁 Pratinjau</button>
    </div>
    <textarea id="noteBody" class="note-body" placeholder="Tulis materi di sini…"></textarea>
    <div id="notePreview" class="note-preview hidden"></div>
    <div id="editorEmpty" class="empty-state">
      <p>Buat catatan untuk mulai menulis.</p>
    </div>
  </main>

</div>

<!-- ===== Dialog: buat / edit binder ===== -->
<div id="binderDialog" class="dialog-backdrop hidden">
  <div class="dialog">
    <h3 id="binderDialogTitle">Binder baru</h3>
    <label class="field-label" for="binderNameInput">Nama binder</label>
    <input id="binderNameInput" type="text" placeholder="mis. Statistika" maxlength="60" />
    <label class="field-label">Warna label</label>
    <div id="colorPicker" class="color-picker"></div>
    <div class="dialog-actions">
      <button id="btnDeleteBinder" class="btn btn-danger-text hidden">Hapus binder</button>
      <div class="dialog-actions-right">
        <button id="btnCancelBinder" class="btn btn-ghost">Batal</button>
        <button id="btnSaveBinder" class="btn btn-primary">Simpan</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<input id="importFileInput" type="file" accept="application/json" class="hidden" />

<footer class="app-footer">
  <button id="btnExport" class="link-btn">Ekspor semua (.json)</button>
  <span class="dot">·</span>
  <button id="btnImport" class="link-btn">Impor</button>
  <span class="dot">·</span>
  <span id="storageInfo" class="storage-info"></span>
</footer>

<script>
// ===== Storage =====
const STORAGE_KEY = "binder.v3";
const THEME_KEY = "binder.theme";
const COLORS = ["#FFE4E1", "#BC8F8F", "#FFE4B5", "#E6E6FA", "#FF69B4", "#7cf6ab", "#242f7c", "#8baa27", "#8e1010", "#623c7a", "#5C7A4B","#ff0800","#00d9ff","#1fff02","#ff048e", "#6c4095"];

function normalizeNote(n) {
  return Object.assign({}, n, {
    title: typeof n.title === "string" ? n.title : "",
    body: typeof n.body === "string" ? n.body : "",
    tags: Array.isArray(n.tags) ? n.tags.filter((t) => typeof t === "string" && t) : [],
  });
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { binders: [], notes: [] };
    const parsed = JSON.parse(raw);
    return {
      binders: Array.isArray(parsed.binders) ? parsed.binders : [],
      notes: Array.isArray(parsed.notes) ? parsed.notes.map(normalizeNote) : [],
    };
  } catch (e) {
    console.error("Gagal memuat data, mulai kosong.", e);
    return { binders: [], notes: [] };
  }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
    return true;
  } catch (e) {
    console.error("Gagal menyimpan (mungkin penyimpanan penuh).", e);
    showToast("Gagal menyimpan. Penyimpanan perangkat mungkin penuh.");
    return false;
  }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// ===== State =====
const state = {
  data: loadData(),
  activeBinderId: null,
  activeNoteId: null,
  view: "binders", // binders | notes | editor  (mobile drill-down)
  tagFilter: null,
  preview: false,
};

// ===== DOM refs =====
const $ = (id) => document.getElementById(id);
const appEl = $("app");
const binderList = $("binderList");
const binderEmpty = $("binderEmpty");
const notesTitle = $("notesTitle");
const noteList = $("noteList");
const noteEmpty = $("noteEmpty");
const searchNotes = $("searchNotes");
const noteTitleInput = $("noteTitleInput");
const noteBody = $("noteBody");
const notePreview = $("notePreview");
const noteMeta = $("noteMeta");
const saveState = $("saveState");
const editorEmpty = $("editorEmpty");
const storageInfo = $("storageInfo");
const tagFilterEl = $("tagFilter");
const tagChipsEl = $("tagChips");
const tagInput = $("tagInput");

const activeNote = () => state.data.notes.find((n) => n.id === state.activeNoteId);

// ===== Tema (terang / gelap) =====
function currentTheme() {
  const t = document.documentElement.getAttribute("data-theme");
  if (t) return t;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  $("btnTheme").textContent = t === "dark" ? "☀" : "☾";
}
(function initTheme() {
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
  } catch (e) {}
  applyTheme(currentTheme());
})();
$("btnTheme").addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
});

// ===== Markdown ringan (untuk pratinjau) =====
function escHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function inlineMd(s) {
  s = escHtml(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  return s;
}
function renderMarkdown(src) {
  const lines = src.replace(/\r\n/g, "\n").split("\n");
  let html = "", list = null, para = [];
  const flushPara = () => {
    if (para.length) { html += "<p>" + para.map(inlineMd).join("<br>") + "</p>"; para = []; }
  };
  const closeList = () => { if (list) { html += "</" + list + ">"; list = null; } };
  const openList = (tag) => { if (list !== tag) { closeList(); html += "<" + tag + ">"; list = tag; } };
  for (const line of lines) {
    let m;
    if (!line.trim()) { flushPara(); closeList(); continue; }
    if ((m = line.match(/^(#{1,3})\s+(.*)$/))) {
      flushPara(); closeList();
      html += `<h${m[1].length}>${inlineMd(m[2])}</h${m[1].length}>`;
      continue;
    }
    if ((m = line.match(/^\s*[-*]\s+\[( |x)\]\s+(.*)$/i))) {
      flushPara(); openList("ul");
      html += `<li class="check">${m[1].toLowerCase() === "x" ? "☑" : "☐"} ${inlineMd(m[2])}</li>`;
      continue;
    }
    if ((m = line.match(/^\s*[-*]\s+(.*)$/))) {
      flushPara(); openList("ul");
      html += "<li>" + inlineMd(m[1]) + "</li>";
      continue;
    }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      flushPara(); openList("ol");
      html += "<li>" + inlineMd(m[1]) + "</li>";
      continue;
    }
    if ((m = line.match(/^>\s?(.*)$/))) {
      flushPara(); closeList();
      html += "<blockquote>" + inlineMd(m[1]) + "</blockquote>";
      continue;
    }
    if (/^(-{3,}|\*{3,})$/.test(line.trim())) { flushPara(); closeList(); html += "<hr>"; continue; }
    closeList();
    para.push(line);
  }
  flushPara(); closeList();
  return html;
}

// ===== Rendering =====
function render() {
  renderBinders();
  renderNotes();
  renderEditor();
  appEl.className = "app view-" + state.view;
  renderStorageInfo();
}

function renderBinders() {
  binderList.innerHTML = "";
  const binders = state.data.binders;
  binderEmpty.classList.toggle("hidden", binders.length > 0);
  binders.forEach((b) => {
    const count = state.data.notes.filter((n) => n.binderId === b.id).length;
    const li = document.createElement("li");
    li.className = "binder-item" + (b.id === state.activeBinderId ? " active" : "");
    li.style.setProperty("--spine", b.color);
    li.innerHTML = `
      <span class="binder-spine"></span>
      <span class="binder-name"></span>
      <span class="binder-count">${count}</span>
      <button class="binder-edit" title="Edit binder" aria-label="Edit binder">✎</button>
    `;
    li.querySelector(".binder-name").textContent = b.name;
    li.addEventListener("click", (e) => {
      if (e.target.closest(".binder-edit")) return;
      openBinder(b.id);
    });
    li.querySelector(".binder-edit").addEventListener("click", (e) => {
      e.stopPropagation();
      openBinderDialog(b);
    });
    binderList.appendChild(li);
  });
}

function renderTagFilter(binderNotes) {
  const all = [];
  binderNotes.forEach((n) => n.tags.forEach((t) => { if (!all.includes(t)) all.push(t); }));
  all.sort();
  if (state.tagFilter && !all.includes(state.tagFilter)) state.tagFilter = null;
  tagFilterEl.innerHTML = "";
  tagFilterEl.classList.toggle("hidden", all.length === 0);
  all.forEach((t) => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "tag-chip filter" + (state.tagFilter === t ? " on" : "");
    chip.textContent = "#" + t;
    chip.addEventListener("click", () => {
      state.tagFilter = state.tagFilter === t ? null : t;
      renderNotes();
    });
    tagFilterEl.appendChild(chip);
  });
}

function renderNotes() {
  const binder = state.data.binders.find((b) => b.id === state.activeBinderId);
  notesTitle.textContent = binder ? binder.name : "Pilih binder";
  noteList.innerHTML = "";

  if (!binder) {
    noteEmpty.classList.add("hidden");
    tagFilterEl.classList.add("hidden");
    return;
  }

  const binderNotes = state.data.notes.filter((n) => n.binderId === binder.id);
  renderTagFilter(binderNotes);

  const query = searchNotes.value.trim().toLowerCase();
  let notes = binderNotes.slice().sort((a, b) => b.updatedAt - a.updatedAt);

  if (state.tagFilter) notes = notes.filter((n) => n.tags.includes(state.tagFilter));
  if (query) {
    notes = notes.filter(
      (n) =>
        n.title.toLowerCase().includes(query) ||
        n.body.toLowerCase().includes(query) ||
        n.tags.some((t) => t.includes(query.replace(/^#/, "")))
    );
  }

  noteEmpty.classList.toggle("hidden", notes.length > 0);
  notes.forEach((n) => {
    const li = document.createElement("li");
    li.className = "note-item" + (n.id === state.activeNoteId ? " active" : "");
    const snippet = n.body.trim().slice(0, 80).replace(/\n/g, " ").replace(/[#*`>]/g, "");
    li.innerHTML = `
      <div class="note-item-title"></div>
      <div class="note-item-snippet"></div>
      <div class="note-item-date">${formatDate(n.updatedAt)}</div>
    `;
    li.querySelector(".note-item-title").textContent = n.title || "(Tanpa judul)";
    li.querySelector(".note-item-snippet").textContent = snippet;
    if (n.tags.length) {
      const box = document.createElement("div");
      box.className = "tag-chips";
      n.tags.forEach((t) => {
        const c = document.createElement("span");
        c.className = "tag-chip";
        c.textContent = "#" + t;
        box.appendChild(c);
      });
      li.appendChild(box);
    }
    li.addEventListener("click", () => openNote(n.id));
    noteList.appendChild(li);
  });
}

function renderTagChips(note) {
  tagChipsEl.innerHTML = "";
  note.tags.forEach((t) => {
    const chip = document.createElement("span");
    chip.className = "tag-chip";
    chip.appendChild(document.createTextNode("#" + t));
    const x = document.createElement("button");
    x.type = "button";
    x.textContent = "×";
    x.title = "Hapus tag";
    x.setAttribute("aria-label", "Hapus tag " + t);
    x.addEventListener("click", () => removeTag(t));
    chip.appendChild(x);
    tagChipsEl.appendChild(chip);
  });
}

function renderEditor() {
  const note = activeNote();
  const hasNote = !!note;
  editorEmpty.classList.toggle("hidden", hasNote);
  noteTitleInput.classList.toggle("hidden", !hasNote);
  $("btnDeleteNote").classList.toggle("hidden", !hasNote);
  $("noteMeta").classList.toggle("hidden", !hasNote);
  $("tagBar").classList.toggle("hidden", !hasNote);
  $("editorToolbar").classList.toggle("hidden", !hasNote);

  const showPreview = hasNote && state.preview;
  noteBody.classList.toggle("hidden", !hasNote || showPreview);
  notePreview.classList.toggle("hidden", !showPreview);
  $("btnPreview").classList.toggle("on", showPreview);
  $("btnPreview").textContent = showPreview ? "✎ Edit" : "👁 Pratinjau";
  document.querySelectorAll("#editorToolbar .tool-btn[data-act]").forEach((b) => { b.disabled = showPreview; });

  if (!hasNote) return;
  if (document.activeElement !== noteTitleInput) noteTitleInput.value = note.title;
  if (document.activeElement !== noteBody) noteBody.value = note.body;
  if (showPreview) {
    notePreview.innerHTML = note.body.trim()
      ? renderMarkdown(note.body)
      : '<p class="muted">Catatan masih kosong.</p>';
  }
  renderTagChips(note);
  noteMeta.textContent = "Diperbarui " + formatDate(note.updatedAt);
}

function renderStorageInfo() {
  const kb = Math.round((JSON.stringify(state.data).length / 1024) * 10) / 10;
  storageInfo.textContent = `${state.data.notes.length} catatan · ${kb} KB tersimpan di perangkat ini`;
}

function formatDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString("id-ID", { day: "numeric", month: "short" }) +
    " " + d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
}

// ===== Navigation =====
function setView(v) {
  state.view = v;
  render();
}

function openBinder(id) {
  flushSave();
  state.activeBinderId = id;
  state.activeNoteId = null;
  state.tagFilter = null;
  searchNotes.value = "";
  setView("notes");
}

function openNote(id) {
  flushSave();
  state.activeNoteId = id;
  setView("editor");
}

$("btnBackToBinders").addEventListener("click", () => { flushSave(); setView("binders"); });
$("btnBackToNotes").addEventListener("click", () => { flushSave(); setView("notes"); });

// on wide screens all panels are visible; clicking a binder should still load its notes
window.addEventListener("resize", render);

// ===== Binder CRUD =====
let editingBinderId = null;

$("btnAddBinder").addEventListener("click", () => openBinderDialog(null));

function openBinderDialog(binder) {
  editingBinderId = binder ? binder.id : null;
  $("binderDialogTitle").textContent = binder ? "Edit binder" : "Binder baru";
  $("binderNameInput").value = binder ? binder.name : "";
  $("btnDeleteBinder").classList.toggle("hidden", !binder);
  buildColorPicker(binder ? binder.color : COLORS[state.data.binders.length % COLORS.length]);
  $("binderDialog").classList.remove("hidden");
  setTimeout(() => $("binderNameInput").focus(), 0);
}

function buildColorPicker(selected) {
  const picker = $("colorPicker");
  picker.innerHTML = "";
  COLORS.forEach((c) => {
    const sw = document.createElement("button");
    sw.type = "button";
    sw.className = "color-swatch" + (c === selected ? " selected" : "");
    sw.style.background = c;
    sw.dataset.color = c;
    sw.addEventListener("click", () => {
      picker.querySelectorAll(".color-swatch").forEach((s) => s.classList.remove("selected"));
      sw.classList.add("selected");
    });
    picker.appendChild(sw);
  });
}

$("btnCancelBinder").addEventListener("click", () => $("binderDialog").classList.add("hidden"));

$("btnSaveBinder").addEventListener("click", () => {
  const name = $("binderNameInput").value.trim();
  if (!name) { showToast("Nama binder tidak boleh kosong."); return; }
  const color = $("colorPicker").querySelector(".selected")?.dataset.color || COLORS[0];

  if (editingBinderId) {
    const b = state.data.binders.find((x) => x.id === editingBinderId);
    b.name = name;
    b.color = color;
  } else {
    const b = { id: uid(), name, color, createdAt: Date.now() };
    state.data.binders.push(b);
    state.activeBinderId = b.id;
  }
  saveData();
  $("binderDialog").classList.add("hidden");
  render();
});

$("btnDeleteBinder").addEventListener("click", () => {
  if (!editingBinderId) return;
  const noteCount = state.data.notes.filter((n) => n.binderId === editingBinderId).length;
  if (!confirm(`Hapus binder ini beserta ${noteCount} catatan di dalamnya? Tindakan ini tidak bisa dibatalkan.`)) return;
  state.data.binders = state.data.binders.filter((b) => b.id !== editingBinderId);
  state.data.notes = state.data.notes.filter((n) => n.binderId !== editingBinderId);
  if (state.activeBinderId === editingBinderId) {
    state.activeBinderId = null;
    state.activeNoteId = null;
    setView("binders");
  }
  saveData();
  $("binderDialog").classList.add("hidden");
  render();
});

// ===== Note CRUD =====
$("btnAddNote").addEventListener("click", () => {
  if (!state.activeBinderId) { showToast("Pilih atau buat binder dulu."); return; }
  flushSave();
  const n = {
    id: uid(),
    binderId: state.activeBinderId,
    title: "",
    body: "",
    tags: [],
    createdAt: Date.now(),
    updatedAt: Date.now(),
  };
  state.data.notes.push(n);
  state.activeNoteId = n.id;
  state.preview = false;
  saveData();
  setView("editor");
  setTimeout(() => noteTitleInput.focus(), 0);
});

$("btnDeleteNote").addEventListener("click", () => {
  if (!state.activeNoteId) return;
  if (!confirm("Hapus catatan ini?")) return;
  clearTimeout(saveTimer);
  pendingSave = false;
  state.data.notes = state.data.notes.filter((n) => n.id !== state.activeNoteId);
  state.activeNoteId = null;
  saveData();
  setView("notes");
});

// Perubahan teks langsung masuk ke catatan aktif; penyimpanan ke perangkat ditunda 400 ms.
let saveTimer = null;
let pendingSave = false;
function commitSave() {
  pendingSave = false;
  saveData();
  const note = activeNote();
  if (note) noteMeta.textContent = "Diperbarui " + formatDate(note.updatedAt);
  renderNotes();
  renderBinders();
  saveState.textContent = "Tersimpan";
  renderStorageInfo();
}
function flushSave() {
  if (!pendingSave) return;
  clearTimeout(saveTimer);
  commitSave();
}
function scheduleSave() {
  const note = activeNote();
  if (!note) return;
  note.title = noteTitleInput.value;
  note.body = noteBody.value;
  note.updatedAt = Date.now();
  pendingSave = true;
  saveState.textContent = "Menyimpan…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(commitSave, 400);
}
noteTitleInput.addEventListener("input", scheduleSave);
noteBody.addEventListener("input", scheduleSave);
searchNotes.addEventListener("input", renderNotes);
window.addEventListener("pagehide", flushSave);
document.addEventListener("visibilitychange", () => { if (document.hidden) flushSave(); });

// ===== Tag =====
function addTags(raw) {
  const note = activeNote();
  if (!note) return;
  let changed = false;
  raw.split(",").forEach((part) => {
    const t = part.trim().replace(/^#+/, "").toLowerCase().slice(0, 30);
    if (t && !note.tags.includes(t)) { note.tags.push(t); changed = true; }
  });
  if (changed) {
    note.updatedAt = Date.now();
    saveData();
    renderEditor();
    renderNotes();
    renderStorageInfo();
  }
}
function removeTag(t) {
  const note = activeNote();
  if (!note) return;
  note.tags = note.tags.filter((x) => x !== t);
  note.updatedAt = Date.now();
  saveData();
  renderEditor();
  renderNotes();
  renderStorageInfo();
}
tagInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === ",") {
    e.preventDefault();
    addTags(tagInput.value);
    tagInput.value = "";
  }
});
tagInput.addEventListener("blur", () => {
  if (tagInput.value.trim()) { addTags(tagInput.value); tagInput.value = ""; }
});

// ===== Format teks (toolbar) =====
function afterTextChange() {
  noteBody.focus();
  scheduleSave();
}

function wrapSelection(mark, placeholder) {
  const v = noteBody.value;
  const s = noteBody.selectionStart, e = noteBody.selectionEnd;
  const sel = v.slice(s, e);
  const before = v.slice(Math.max(0, s - mark.length), s);
  const after = v.slice(e, e + mark.length);
  if (sel && before === mark && after === mark) {
    // sudah terbungkus -> lepas
    noteBody.value = v.slice(0, s - mark.length) + sel + v.slice(e + mark.length);
    noteBody.setSelectionRange(s - mark.length, e - mark.length);
  } else {
    const text = sel || placeholder;
    noteBody.value = v.slice(0, s) + mark + text + mark + v.slice(e);
    noteBody.setSelectionRange(s + mark.length, s + mark.length + text.length);
  }
  afterTextChange();
}

const LINE_FORMATS = {
  h1:    { re: /^#\s+/,                        make: () => "# " },
  h2:    { re: /^##\s+/,                       make: () => "## " },
  ul:    { re: /^[-*]\s+(?!\[( |x)\])/i,       make: () => "- " },
  ol:    { re: /^\d+[.)]\s+/,                  make: (i) => `${i + 1}. ` },
  check: { re: /^[-*]\s+\[( |x)\]\s+/i,        make: () => "- [ ] " },
  quote: { re: /^>\s?/,                        make: () => "> " },
};
const ANY_PREFIX = /^(#{1,3}\s+|[-*]\s+\[( |x)\]\s+|[-*]\s+|\d+[.)]\s+|>\s?)/i;

function formatLines(kind) {
  const def = LINE_FORMATS[kind];
  const v = noteBody.value;
  const s = noteBody.selectionStart, e = noteBody.selectionEnd;
  const ls = v.lastIndexOf("\n", s - 1) + 1;
  let le = v.indexOf("\n", e);
  if (le === -1) le = v.length;
  const lines = v.slice(ls, le).split("\n");
  const allHave = lines.every((l) => def.re.test(l));
  const out = lines
    .map((l, i) => (allHave ? l.replace(def.re, "") : def.make(i) + l.replace(ANY_PREFIX, "")))
    .join("\n");
  noteBody.value = v.slice(0, ls) + out + v.slice(le);
  noteBody.setSelectionRange(ls, ls + out.length);
  afterTextChange();
}

function runFormat(act) {
  if (!activeNote() || state.preview) return;
  if (act === "bold") wrapSelection("**", "teks tebal");
  else if (act === "italic") wrapSelection("*", "teks miring");
  else if (LINE_FORMATS[act]) formatLines(act);
}

document.querySelectorAll("#editorToolbar .tool-btn[data-act]").forEach((btn) => {
  btn.addEventListener("mousedown", (e) => e.preventDefault()); // jaga fokus & seleksi teks
  btn.addEventListener("click", () => runFormat(btn.dataset.act));
});

$("btnPreview").addEventListener("click", () => {
  flushSave();
  state.preview = !state.preview;
  renderEditor();
  if (!state.preview) noteBody.focus();
});

noteBody.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey) {
    const k = e.key.toLowerCase();
    if (k === "b") { e.preventDefault(); runFormat("bold"); }
    else if (k === "i") { e.preventDefault(); runFormat("italic"); }
  }
});

// ===== Export / Import =====
$("btnExport").addEventListener("click", () => {
  flushSave();
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `binder-catatan-${stamp}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

$("btnImport").addEventListener("click", () => $("importFileInput").click());

$("importFileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const incoming = JSON.parse(reader.result);
      if (!Array.isArray(incoming.binders) || !Array.isArray(incoming.notes)) {
        throw new Error("Format tidak dikenali");
      }
      flushSave();
      const incomingNotes = incoming.notes.map(normalizeNote);
      const mode = confirm(
        "OK = Gabungkan dengan data yang ada.\nBatal = Ganti semua data yang ada dengan file ini."
      );
      if (mode) {
        const existingBinderIds = new Set(state.data.binders.map((b) => b.id));
        incoming.binders.forEach((b) => { if (!existingBinderIds.has(b.id)) state.data.binders.push(b); });
        const existingNoteIds = new Set(state.data.notes.map((n) => n.id));
        incomingNotes.forEach((n) => { if (!existingNoteIds.has(n.id)) state.data.notes.push(n); });
      } else {
        state.data = { binders: incoming.binders, notes: incomingNotes };
      }
      state.activeBinderId = null;
      state.activeNoteId = null;
      state.tagFilter = null;
      saveData();
      setView("binders");
      showToast("Impor berhasil.");
    } catch (err) {
      showToast("Gagal impor: file tidak valid.");
    }
    e.target.value = "";
  };
  reader.readAsText(file);
});

// ===== Toast =====
let toastTimer = null;
function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add("hidden"), 2600);
}

// ===== Init =====
render();
// Catatan: semua CSS & JS sudah ada di dalam file ini, sehingga bisa dibuka offline sepenuhnya
// tanpa service worker, manifest, atau file tambahan.

// ===== Pasang sebagai aplikasi (PWA) =====
// Hanya aktif saat dibuka lewat https (mis. GitHub Pages); dilewati kalau dibuka sebagai file biasa.
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => {
      console.warn("Service worker gagal didaftarkan:", err);
    });
  });
}
